<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ═══════════════════════════════════════════════════════════
       FAVICON — ícone que aparece na aba do browser
       Trocar "sobe.png" pelo nome do arquivo de ícone desejado
       O arquivo deve estar no TEMPLATE_REPO abaixo
  ════════════════════════════════════════════════════════════ -->
  <link rel="shortcut icon" href="https://mggastal.github.io/sobe-template/sobe.png">
  <link rel="icon" type="image/png" href="https://mggastal.github.io/sobe-template/sobe.png">

  <title>Carregando...</title>
  <style>
    body { margin: 0; background: #0a0f1e; display: flex; align-items: center;
           justify-content: center; height: 100vh; font-family: sans-serif; }
    .loader { text-align: center; color: rgba(255,255,255,.4); }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.1);
               border-top-color: #6659A5; border-radius: 50%;
               animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div>Carregando dados...</div>
  </div>

  <script>
    // ╔══════════════════════════════════════════════════════════════╗
    // ║                     CONFIG DO LOADER                        ║
    // ╠══════════════════════════════════════════════════════════════╣

    // Repositório central do template (GitHub Pages da Sobé)
    // Trocar se o repo do template mudar de nome ou usuário
    const TEMPLATE_REPO = 'https://mggastal.github.io/sobe-template';

    // Nome do arquivo de template dentro do TEMPLATE_REPO
    const TEMPLATE_FILE = 'template.html';

    // Nome do arquivo de dados gerado pelo dashboard.py
    const DATA_FILE = 'data.json';

    // ╚══════════════════════════════════════════════════════════════╝

    const TEMPLATE_URL = `${TEMPLATE_REPO}/${TEMPLATE_FILE}`;
    const DATA_URL     = `./${DATA_FILE}`;
    const BASE_URL     = window.location.href.replace(/\/[^\/]*$/, '/');

    // Executa lista de <script> em sequência (ordem garante dependências)
    function runScriptsSequential(scripts) {
      return [...scripts].reduce((chain, oldScript) => {
        return chain.then(() => new Promise(resolve => {
          const s = document.createElement('script');
          if (oldScript.src) {
            s.src = oldScript.src;
            s.onload = resolve;
            s.onerror = resolve;
          } else {
            s.textContent = oldScript.textContent;
            resolve();
          }
          oldScript.parentNode.replaceChild(s, oldScript);
        }));
      }, Promise.resolve());
    }

    Promise.all([
      fetch(TEMPLATE_URL).then(r => { if(!r.ok) throw new Error('Template indisponível: ' + TEMPLATE_URL); return r.text(); }),
      fetch(DATA_URL).then(r => { if(!r.ok) throw new Error('data.json não encontrado'); return r.json(); })
    ])
    .then(([templateHtml, data]) => {
      // 1. Injetar dados antes do </head>
      const dataScript = `<script>
window.DASH_DATA = ${JSON.stringify(data)};
window.DASH_BASE_URL = '${BASE_URL}';
<\/script>`;
      templateHtml = templateHtml.replace('</head>', dataScript + '</head>');

      // 2. Parsear o HTML
      const parser = new DOMParser();
      const doc = parser.parseFromString(templateHtml, 'text/html');

      // 3. Copiar atributos do <html> (data-theme etc)
      [...doc.documentElement.attributes].forEach(a =>
        document.documentElement.setAttribute(a.name, a.value)
      );

      // 4. Copiar estilos e links do <head> (ignorar favicons — já estão no loader)
      [...doc.head.childNodes].forEach(node => {
        if (node.nodeName === 'LINK') {
          const rel = node.getAttribute('rel') || '';
          if (rel.includes('icon')) return;
        }
        if (node.nodeName === 'SCRIPT') return; // scripts executados depois
        document.head.appendChild(document.adoptNode(node.cloneNode(true)));
      });

      // 5. Substituir body
      document.body.innerHTML = doc.body.innerHTML;
      [...doc.body.attributes].forEach(a => document.body.setAttribute(a.name, a.value));

      // 6. Executar scripts na ordem correta: HEAD primeiro, depois BODY
      // (Chart.js e plugins estão no head — precisam rodar antes do dashboard JS)
      const headScripts = doc.head.querySelectorAll('script');
      const bodyScripts = document.body.querySelectorAll('script');

      return runScriptsSequential(headScripts)
        .then(() => runScriptsSequential(bodyScripts));
    })
    .catch(err => {
      document.body.innerHTML = `
        <div style="color:#f87171;text-align:center;font-family:sans-serif;padding:40px">
          <div style="font-size:24px;margin-bottom:12px">⚠️ Erro ao carregar</div>
          <div style="opacity:.6;font-size:14px">${err.message}</div>
        </div>`;
    });
  </script>
</body>
</html>
